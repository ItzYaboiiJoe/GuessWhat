
<svg width="100%" height="100%" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#000010"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b2c82" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="galaxy" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#spaceGradient)" />

  <!-- Large Nebula Glow -->
  <circle cx="800" cy="400" r="300" fill="url(#nebula)" />

  <!-- Spiral Galaxy -->
  <ellipse cx="400" cy="800" rx="250" ry="100" fill="url(#galaxy)" transform="rotate(-20 400 800)" />

  <!-- Stars with glow -->
  <g fill="white" filter="url(#glow)">
    <!-- Main stars -->
    <circle cx="100" cy="200" r="1.5" />
    <circle cx="220" cy="180" r="1.2" />
    <circle cx="360" cy="300" r="2.2" />
    <circle cx="480" cy="160" r="1.1" />
    <circle cx="620" cy="450" r="1.8" />
    <circle cx="760" cy="260" r="1.4" />
    <circle cx="900" cy="120" r="1.7" />
    <circle cx="1060" cy="540" r="1.5" />
    <circle cx="1220" cy="300" r="1.6" />
    <circle cx="1360" cy="460" r="1.3" />
    <!-- Extra filler stars -->
    <circle cx="180" cy="600" r="1" />
    <circle cx="300" cy="500" r="1.4" />
    <circle cx="950" cy="800" r="1.6" />
    <circle cx="1200" cy="700" r="1.2" />
    <circle cx="1300" cy="880" r="1.3" />
    <!-- Star clusters -->
    <circle cx="1100" cy="900" r="0.7" />
    <circle cx="1150" cy="920" r="0.9" />
    <circle cx="1180" cy="940" r="0.6" />
    <circle cx="1230" cy="960" r="1.1" />
    <circle cx="1270" cy="980" r="0.8" />
    <circle cx="1320" cy="990" r="1.0" />
    <circle cx="200" cy="900" r="0.8" />
    <circle cx="250" cy="920" r="0.7" />
    <circle cx="300" cy="940" r="0.6" />
    <circle cx="350" cy="960" r="0.9" />
    <circle cx="400" cy="980" r="1.0" />
  </g>

  <!-- Shooting star trail -->
  <line x1="1000" y1="200" x2="1060" y2="260" stroke="white" stroke-width="0.7" stroke-opacity="0.6" />

  <!-- Constellation lines -->
  <g stroke="white" stroke-opacity="0.5" stroke-width="0.5">
    <line x1="100" y1="200" x2="220" y2="180" />
    <line x1="220" y1="180" x2="360" y2="300" />
    <line x1="360" y1="300" x2="480" y2="160" />

    <line x1="620" y1="450" x2="760" y2="260" />
    <line x1="760" y1="260" x2="900" y2="120" />
    <line x1="900" y1="120" x2="1060" y2="540" />

    <line x1="1220" y1="300" x2="1360" y2="460" />
    <line x1="180" y1="600" x2="300" y2="500" />
    <line x1="300" y1="500" x2="620" y2="450" />
  </g>

  <!-- Asteroid belt: subtle arc of tiny dots -->
  <g fill="#888" opacity="0.3">
    <circle cx="600" cy="650" r="1" />
    <circle cx="620" cy="645" r="0.8" />
    <circle cx="640" cy="640" r="0.9" />
    <circle cx="660" cy="635" r="0.6" />
    <circle cx="680" cy="630" r="1.1" />
    <circle cx="700" cy="625" r="0.7" />
    <circle cx="720" cy="620" r="1.0" />
    <circle cx="740" cy="615" r="0.9" />
    <circle cx="760" cy="610" r="0.8" />
    <circle cx="780" cy="605" r="0.6" />
    <circle cx="800" cy="600" r="1.2" />
  </g>
</svg>
